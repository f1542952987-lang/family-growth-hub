<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>我们的家庭成长站 V17</title><link rel='stylesheet' href='assets/css/app.css'></head><body><div class='app'><div class='hero'><span class='tag'>V17 模块化内容版</span><h1>🏡 我们的家庭成长站</h1><p class='muted'>先选身份，再选一个大方向，然后选具体书/课程，最后进入章节。课程会记住你听到哪里。</p><div class='roles' id='roles'></div></div><div class='nav'><button onclick="show('home')">🏠 首页</button><button onclick="show('library')">🎧 家庭书库</button><button onclick="show('bible')">✝️ 圣经</button></div><section id='home' class='section on'><div id='welcome'></div><div id='resume'></div><div class='card'><h2>今天想听什么？</h2><div class='grid'><button class='card' onclick="show('library')">🎧 深度课程<br><span class='muted'>分类 → 书名 → 章节</span></button><button class='card' onclick="show('bible')">✝️ 听圣经<br><span class='muted'>66卷真实章节目录</span></button></div></div></section><section id='library' class='section'><h2>🎧 家庭书库</h2><p class='muted'>公共书库 + 当前身份专属推荐，自动去重。绿色“深度精讲”表示已经有独立章节内容。</p><div class='cats' id='cats'></div><div class='grid' id='books'></div></section><section id='bible' class='section'><h2>✝️ 圣经</h2><p class='status warn'>V17 已完成66卷真实章节目录的数据模块；完整公版经文和稳定站内音频仍在迁移中，不把导读标成完整经文。</p><div class='biblebooks' id='biblebooks'></div><div id='chapters' class='chapters'></div></section></div><div class='player'><div class='pinner'><strong id='pt'>还没有播放</strong><div id='ps'>选择一节深度课程开始</div><input id='progress' class='bar' type='range' value='0'><div class='controls'><button onclick='prevLesson()'>⏮</button><button onclick='FamilyHubPlayer.seek(-15)'>-15s</button><button id='playBtn' onclick='FamilyHubPlayer.toggle()'>▶</button><button onclick='FamilyHubPlayer.seek(15)'>+15s</button><button onclick='nextLesson()'>⏭</button><select id='speed' onchange='FamilyHubPlayer.speed(this.value)'><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select><select onchange='FamilyHubPlayer.sleep(this.value)'><option value=''>睡眠</option><option value='15'>15分钟</option><option value='30'>30分钟</option><option value='60'>60分钟</option></select><span id='time'>--:--</span></div></div><audio id='audio'></audio></div><script src='assets/js/catalog.js'></script><script src='assets/js/bible.js'></script><script src='assets/js/storage.js'></script><script src='assets/js/player.js'></script><script src='assets/js/courses/parenting.js'></script><script src='assets/js/courses/relationships.js'></script><script src='assets/js/courses/teen.js'></script><script src='assets/js/courses/money.js'></script><script src='assets/js/courses/dorothy-growth.js'></script><script src='assets/js/course-runtime.js'></script><script>var role=FamilyHubStorage.role(),state=FamilyHubStorage.load(),activeQueue=[],activeIndex=0,cat='全部';var rn={dad:'👨 爸爸',mom:'👩 妈妈',bro:'🧑 老弟',me:'👧 我'};function show(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}function setRole(r){role=r;FamilyHubStorage.setRole(r);renderRoles();renderWelcome();renderLibrary()}function renderRoles(){roles.innerHTML=Object.keys(rn).map(r=>'<button class="'+(r==role?'on':'')+'" onclick="setRole(\''+r+'\')">'+rn[r]+'</button>').join('')+'<button onclick="location.href=\'guest.html\'">🌿 访客</button>'}function renderWelcome(){welcome.innerHTML='<h2>'+rn[role]+'，今天想听点什么？</h2><p class="muted">不用赶进度。挑一个现在最有用的主题就好。</p>';var r=state[role].resume;resume.innerHTML=r?'<div class="resume">🎧 继续上次：<b>'+r.course+'</b> · 第'+(r.index+1)+'节<br><button class="btn" onclick="playCourse(\''+r.course.replaceAll("'","\\'")+'\','+r.index+')">▶ 继续播放</button></div>':''}function merged(){var a=[].concat(FAMILY_HUB_CATALOG.shared,FAMILY_HUB_CATALOG.personal[role]||[]),seen={};return a.filter(x=>!seen[x[1]]&&(seen[x[1]]=1))}function renderLibrary(){var data=merged(),cs=['全部'].concat([...new Set(data.map(x=>x[0]))]);cats.innerHTML=cs.map(c=>'<button class="'+(c==cat?'on':'')+'" onclick="cat=\''+c+'\';renderLibrary()">'+c+'</button>').join('');books.innerHTML=data.filter(x=>cat=='全部'||x[0]==cat).map(x=>{var deep=FamilyHubCourses.has(x[1]),st=deep?FamilyHubCourses.stats(x[1]):null;return '<div class="card"><span class="tag">'+x[0]+'</span><h3>《'+x[1]+'》</h3><p class="muted">'+(deep?'🎙️ 原创深度精讲 · '+st.lessons+'节 · 约'+st.minutes+'分钟':'🛠️ 正在升级独立深度课程')+'</p>'+(deep?'<button class="btn" onclick="openCourse(\''+x[1].replaceAll("'","\\'")+'\',this)">查看章节</button>':'')+'<div class="lessons"></div></div>'}).join('')}function openCourse(t,btn){var box=btn.parentElement.querySelector('.lessons'),a=FamilyHubCourses.get(t);box.style.display=box.style.display=='block'?'none':'block';box.innerHTML=a.map((x,i)=>'<div class="lesson"><b>第'+(i+1)+'节 · '+x.title+'</b><br><span class="muted">约'+x.minutes+'分钟 · '+x.kind+'</span><br><button class="btn alt" onclick="playCourse(\''+t.replaceAll("'","\\'")+'\','+i+')">▶ 听这一节</button></div>').join('')}function playCourse(t,i){activeQueue=FamilyHubCourses.get(t);activeIndex=i;var q=activeQueue.map(x=>({title:'《'+t+'》 · '+x.title,subtitle:'第'+(x.index+1)+'节 · 约'+x.minutes+'分钟 · 原创深度精讲',text:x.text}));FamilyHubPlayer.playQueue(q,i);state[role].resume={course:t,index:i};FamilyHubStorage.save(state);renderWelcome()}function prevLesson(){if(activeQueue.length&&activeIndex>0){activeIndex--;playCourse(activeQueue[0].course,activeIndex)}}function nextLesson(){if(activeQueue.length&&activeIndex+1<activeQueue.length){activeIndex++;playCourse(activeQueue[0].course,activeIndex)}}function renderBible(){biblebooks.innerHTML=FAMILY_HUB_BIBLE.names.map((n,i)=>'<button onclick="openBible('+i+')">'+n+'</button>').join('')}function openBible(i){chapters.innerHTML='<h3>'+FAMILY_HUB_BIBLE.names[i]+' · '+FAMILY_HUB_BIBLE.chapters[i]+'章</h3>'+Array.from({length:FAMILY_HUB_BIBLE.chapters[i]},(_,j)=>'<button disabled>第'+(j+1)+'章</button>').join('')+'<p class="muted">完整公版经文迁移后，这些章节按钮会直接打开站内阅读/播放，不跳外站。</p>'}FamilyHubPlayer.bind();renderRoles();renderWelcome();renderLibrary();renderBible();</script></body></html>
