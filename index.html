<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我们家的慢慢成长</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",system-ui;background:#f7f1e8;color:#292522}.app{max-width:1180px;margin:auto;padding:18px}.hero,.card,.shelf{background:#fffaf3;border:1px solid #e5d9c9;border-radius:22px}.hero{padding:24px;background:linear-gradient(145deg,#fffaf2,#e6efe4)}h1{font-size:38px;margin:8px 0}.muted{color:#756b62;line-height:1.7}.roles,.nav,.cats{display:flex;gap:8px;overflow:auto;flex-wrap:wrap}.role,.nav button,.cats button{border:0;border-radius:999px;background:#fff;padding:11px 15px;white-space:nowrap;cursor:pointer}.role.on,.cats button.on{background:#31513d;color:#fff}.nav{position:sticky;top:0;padding:12px 0;background:#f7f1e8ee;z-index:5}.section{display:none}.section.on{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.shelf{padding:18px}.tag{display:inline-block;background:#e4eee3;border-radius:999px;padding:5px 9px;font-size:12px}.btn{border:0;border-radius:12px;padding:10px 13px;background:#31513d;color:#fff;margin:3px;cursor:pointer}.btn.alt{background:#efe2d1;color:#352d28}.booksInCat,.lessons{display:none;margin-top:12px}.bookrow{border-top:1px solid #eadfd2;padding:13px 0}.bookrow h4{margin:4px 0}.lesson,.post{border-top:1px solid #eadfd2;padding:9px 0}.resume{background:#294637;color:#fff;border-radius:20px;padding:18px;margin:12px 0}.player{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(94%,760px);background:#24392d;color:#fff;border-radius:18px;padding:13px;display:none;z-index:10}.upload{border:2px dashed #d6c8b8;border-radius:16px;padding:14px;margin:12px 0}.media{max-width:100%;max-height:340px;border-radius:12px}.stat{font-size:28px;font-weight:700}.biblebooks{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.biblebooks button{border:1px solid #ddd0c0;background:white;border-radius:10px;padding:9px}.catcard{cursor:pointer}.catcard:hover{transform:translateY(-2px);transition:.15s}.bookcount{font-size:13px;color:#756b62}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.biblebooks{grid-template-columns:repeat(3,1fr)}h1{font-size:29px}.app{padding:11px}}</style></head><body><main class="app"><div class="hero"><div>🌿 FAMILY HUB · 我们家的慢慢成长</div><h1>一家人，慢慢认识彼此</h1><p class="muted">先选“我是谁”。书库现在是「大方向 → 具体书籍 → 章节」三级结构；访客馆里的公开书单也已经合并进每个人的书库，重复书名自动去重。</p><div class="roles" id="roles"></div></div><nav class="nav"><button onclick="go('home')">🏠 我的首页</button><button onclick="go('library')">🎧 我的书库</button><button onclick="go('bible')">✝️ 圣经</button><button onclick="go('music')">🎵 赞美诗</button><button onclick="go('family')">📸 看看家里</button><button onclick="go('dash')">📊 全家看板</button></nav><section id="home" class="section on"></section><section id="library" class="section"><h2 id="libTitle"></h2><p class="muted">先挑一个方向，再挑一本书。点开书以后，才会看到章节并决定从哪里听。</p><div class="cats" id="cats"></div><div class="grid" id="grid"></div></section><section id="bible" class="section"><h2>✝️ 圣经 · 按书卷听</h2><p class="muted">选择书卷和章节；网页会记住每个人上次听到的位置。</p><div class="card"><div class="biblebooks" id="bibleBooks"></div><div id="chapters" style="margin-top:12px"></div></div></section><section id="music" class="section"><h2>🎵 赞美诗</h2><div class="grid"><div class="card"><h3>🙏 安静敬拜</h3><p>适合灵修、休息和睡前。</p></div><div class="card"><h3>🌅 上班听</h3><p>适合工作时连续播放。</p></div><div class="card"><h3>❤️ 感恩与祷告</h3><p>适合祷告和家庭安静时间。</p></div></div></section><section id="family" class="section"><h2>📸 看看家里</h2><p class="muted" id="familyHint"></p><div class="card"><textarea id="postText" style="width:100%;min-height:75px;border:1px solid #ddd0c0;border-radius:12px;padding:10px" placeholder="分享一句最近发生的小事……"></textarea><div class="upload">📷 照片 / 🎬 视频 <input id="media" type="file" accept="image/*,video/*"></div><button class="btn" onclick="addPost()">发布我的最近</button><div id="posts"></div></div></section><section id="dash" class="section"><h2>📊 全家成长看板</h2><div class="grid" id="dashGrid"></div></section></main><div class="player" id="player"><b id="pt"></b><div id="ps"></div><button class="btn alt" onclick="speechSynthesis.pause()">⏸</button><button class="btn alt" onclick="speechSynthesis.resume()">▶</button><button class="btn alt" onclick="nextLesson()">⏭</button><button class="btn alt" onclick="speechSynthesis.cancel();player.style.display='none'">■</button></div><script>
var people={dad:['爸爸','👨'],mom:['妈妈','👩'],bro:['老弟','🧑'],me:['我','👧']},role=localStorage.familyRole||'me',filter='全部',cur=null;
var state=JSON.parse(localStorage.familyHubV13||localStorage.familyHubV11||'{}');Object.keys(people).forEach(k=>{if(!state[k])state[k]={min:0,done:0,history:[],resume:null,bible:['约翰福音',1]}});if(!state.posts)state.posts=[];
var publicBooks=[['亲子教育','正面管教'],['亲子教育','被忽视的孩子'],['亲子教育','园丁与木匠'],['亲子教育','美得窒息的母亲'],['亲子教育','好妈妈胜过好老师'],['亲子教育','父母的语言'],['亲子教育','孩子，把你的手给我'],['亲子教育','如何说孩子才会听，怎么听孩子才肯说'],['亲子教育','养育男孩'],['亲子教育','非暴力沟通·亲子篇'],['亲子教育','游戏力'],['亲子教育','你当像鸟飞往你的山'],['家庭关系','不完美的父母'],['家庭关系','热锅上的家庭'],['家庭关系','家庭的觉醒'],['家庭关系','脆弱的家庭'],['家庭关系','成为母亲的选择'],['家庭关系','家庭幸福的艺术'],['家庭关系','请停止在我身旁迷失'],['家庭关系','何以为父'],['家庭关系','高能量家庭'],['家庭关系','兄弟姐妹心理学'],['家庭关系','岁月的针脚'],['家庭关系','中国式家庭'],['心理情绪','津巴多普通心理学'],['心理情绪','被讨厌的勇气'],['心理情绪','蛤蟆先生去看心理医生'],['心理情绪','人生海海'],['心理情绪','人性的弱点'],['心理情绪','简·爱'],['心理情绪','杨绛传'],['心理情绪','一间只属于自己的房间'],['成长学习','刻意练习'],['成长学习','认知天性'],['成长学习','考试脑科学'],['成长学习','自驱型成长'],['成长学习','为什么学生不喜欢上学'],['成长学习','如何培养孩子自主学习力'],['成长学习','微习惯'],['成长学习','打开一颗心智'],['成长学习','自控力'],['成长学习','底层逻辑'],['成长学习','思考，快与慢'],['成长学习','学会提问'],['成长学习','认知觉醒'],['沟通关系','非暴力沟通'],['沟通关系','关键对话'],['沟通关系','情绪智力'],['沟通关系','别独自用餐'],['理财人生','小狗钱钱'],['理财人生','金钱心理学'],['理财人生','穷查理宝典'],['理财人生','财务自由之路'],['理财人生','巴菲特传'],['人生阅读','生命之书'],['人生阅读','人类简史'],['人生阅读','中国通史'],['人生阅读','明朝那些事儿'],['人生阅读','历历在目'],['人生阅读','少有人走的路'],['人生阅读','亲密关系'],['婚姻沟通','幸福的婚姻'],['婚姻沟通','爱的五种语言'],['成长学习','习惯的力量'],['成长学习','如何阅读一本书'],['人生阅读','50岁以后继续成长']];
var personal={dad:[['夫妻关系','怎么和妻子好好说话'],['家庭担当','做一个好爸爸'],['家庭担当','做一个可靠的丈夫'],['健康养生','少一点烟酒，多一点健康'],['健康养生','中年男性健康管理']],mom:[['夫妻关系','怎么和丈夫好好沟通'],['女性成长','做妈妈，也做自己'],['健康养生','家常饮食与健康生活'],['健康养生','煲汤与营养的正确打开方式'],['女性成长','中年女性的自我照顾']],bro:[['父母沟通','怎么和父母正确沟通'],['青春期','青春期：慢慢长成自己'],['学习成长','学习和玩怎么平衡'],['青春期','青春萌动与喜欢一个人'],['成长探索','把青少年生活变丰富'],['成长探索','独立、责任与未来选择'],['青春期','解码青春期'],['青春期','青春期关键对话']],me:[['AI与学习','20几岁女生的AI学习路线'],['AI与学习','专注力与高效学习'],['职场成长','职场成长：从执行到分析'],['表达情商','情商、表达与自信'],['情绪成长','减少内耗与情绪困扰'],['女性成长','20几岁：丰富自己的人生'],['职场成长','建立可迁移的职业能力'],['女性成长','自信、边界与独立感']]};
var themes=['为什么值得读：先认识这本书','核心问题：它到底想解决什么','看见自己的旧模式','事实、感受与解释','关系中的真正需要','一个可以马上使用的方法','遇到冲突时怎么做','建立边界而不是冷漠','把理解变成表达','从知道到真正做到','生活案例与练习','这一章之后的小行动','容易踩的坑与提醒','复盘：把改变留在生活里'];
function save(){localStorage.familyHubV13=JSON.stringify(state)}
function library(){var all=personal[role].concat(publicBooks),seen={};return all.filter(x=>{var k=x[1].replace(/[：:·]/g,'').replace(/家庭课|财商课|主题导读/g,'');if(seen[k])return false;seen[k]=1;return true}).map((x,i)=>[x[0],x[1],12,i])}
function renderRoles(){roles.innerHTML=Object.keys(people).map(k=>'<button class="role '+(k==role?'on':'')+'" onclick="setRole(\''+k+'\')">'+people[k][1]+' '+people[k][0]+'</button>').join('')+'<button class="role" onclick="location.href=\'guest.html\'">👤 访客</button>'}
function setRole(k){role=k;localStorage.familyRole=k;filter='全部';renderAll()}
function otherNames(){return Object.keys(people).filter(k=>k!=role).map(k=>people[k][1]+people[k][0]+'最近').join('　')}
function renderHome(){var r=state[role].resume,h='<h2>'+people[role][1]+' '+people[role][0]+'，今天想听点什么？</h2>';if(r)h+='<div class="resume">🎧 <b>继续上次听的</b><br>'+r.title+' · 第'+(r.lesson+1)+'节<br><button class="btn alt" onclick="playByTitle(\''+r.title.replace(/'/g,"\\'")+'\','+r.lesson+')">▶ 继续播放</button></div>';h+='<div class="grid"><div class="card"><h3>🎧 分类书库</h3><p>大方向 → 具体书名 → 章节，访客公开书单也都在这里。</p><button class="btn" onclick="go(\'library\')">打开书库</button></div><div class="card"><h3>✝️ 今天听一章圣经</h3><p>'+state[role].bible[0]+' 第'+state[role].bible[1]+'章</p><button class="btn" onclick="go(\'bible\')">继续</button></div><div class="card"><h3>📸 看看家里</h3><p>'+otherNames()+'</p><button class="btn" onclick="go(\'family\')">看看最近</button></div></div>';home.innerHTML=h}
function categories(){return ['全部'].concat([...new Set(library().map(x=>x[0]))])}
function renderCats(){cats.innerHTML=categories().map(c=>'<button class="'+(c==filter?'on':'')+'" onclick="filter=\''+c+'\';renderCats();renderLibrary()">'+c+'</button>').join('')}
function renderLibrary(){libTitle.textContent='🎧 '+people[role][1]+' '+people[role][0]+'的书库';var a=library(),groups={};a.forEach((x,i)=>{if(filter!='全部'&&x[0]!=filter)return;(groups[x[0]]||(groups[x[0]]=[])).push([x,i])});grid.innerHTML=Object.keys(groups).map(c=>'<div class="card catcard"><span class="tag">大分类</span><h3>'+categoryIcon(c)+' '+c+'</h3><div class="bookcount">'+groups[c].length+' 本书 / 主题</div><button class="btn" onclick="toggleCategory(this)">📚 看这个分类的书</button><div class="booksInCat">'+groups[c].map(v=>bookHTML(v[0],v[1])).join('')+'</div></div>').join('')}
function categoryIcon(c){if(/亲子|父母|家庭/.test(c))return'👨‍👩‍👧';if(/沟通|表达|夫妻|婚姻/.test(c))return'💬';if(/心理|情绪/.test(c))return'🌙';if(/学习|AI/.test(c))return'🎯';if(/理财/.test(c))return'💰';if(/健康/.test(c))return'🌿';if(/青春/.test(c))return'🌱';if(/女性/.test(c))return'🌸';if(/职场/.test(c))return'💼';return'📖'}
function toggleCategory(b){var box=b.nextElementSibling;box.style.display=box.style.display=='block'?'none':'block'}
function bookHTML(x,i){return '<div class="bookrow"><span class="tag">《具体书籍》</span><h4>《'+x[1]+'》</h4><button class="btn alt" onclick="toggleBook('+i+',this)">🎧 选择章节</button><div class="lessons"></div></div>'}
function toggleBook(i,b){var box=b.nextElementSibling;if(box.style.display=='block'){box.style.display='none';return}var x=library()[i],h='';for(var j=0;j<x[2];j++)h+='<div class="lesson">第'+(j+1)+'节 · '+themes[j%themes.length]+' <button class="btn alt" onclick="play('+i+','+j+')">▶ 听这一节</button></div>';box.innerHTML=h;box.style.display='block'}
function playByTitle(t,j){var i=library().findIndex(x=>x[1]==t);if(i<0)i=0;play(i,j)}
function play(i,j){speechSynthesis.cancel();var x=library()[i];cur=[i,j];state[role].resume={lesson:j,title:x[1]};state[role].history.unshift(x[1]+' · 第'+(j+1)+'节');state[role].history=state[role].history.slice(0,30);state[role].done++;state[role].min+=6;save();pt.textContent='🎧 《'+x[1]+'》';ps.textContent='第'+(j+1)+'/'+x[2]+'节 · '+themes[j%themes.length];player.style.display='block';var u=new SpeechSynthesisUtterance('欢迎收听《'+x[1]+'》主题学习第'+(j+1)+'节，'+themes[j%themes.length]+'。这里是学习型主题导读，不是原书全文朗读。今天只抓住一个能带回生活的小观点。先想一个最近真实发生的场景，再问自己：这一节的想法可以怎样帮助我理解自己、理解家人，或者做出一个更好的小行动？');u.lang='zh-CN';u.rate=.9;u.onend=()=>{if(j+1<x[2])play(i,j+1)};speechSynthesis.speak(u);renderHome();renderDash()}
function nextLesson(){if(cur&&cur[1]+1<library()[cur[0]][2])play(cur[0],cur[1]+1)}
function renderFamily(){familyHint.textContent='这里主要看其他家人的最近：'+otherNames()+'。';var arr=state.posts.filter(p=>p.role!=role);posts.innerHTML=arr.length?arr.map(p=>'<div class="post"><b>'+people[p.role][1]+' '+people[p.role][0]+'</b> · '+p.time+'<p>'+p.text+'</p>'+(p.media||'')+'</div>').join(''):'<p class="muted">其他家人还没有发布最近动态。</p>'}
function addPost(){var text=postText.value.trim(),f=media.files[0];function done(m){state.posts.unshift({role,text:text||'分享了一个最近瞬间',time:new Date().toLocaleString(),media:m||''});save();postText.value='';media.value='';renderFamily()}if(!f)return done('');var r=new FileReader();r.onload=()=>done(f.type.indexOf('video')==0?'<video class="media" controls src="'+r.result+'"></video>':'<img class="media" src="'+r.result+'">');r.readAsDataURL(f)}
function renderDash(){dashGrid.innerHTML=Object.keys(people).map(k=>{var s=state[k];return '<div class="card"><h3>'+people[k][1]+' '+people[k][0]+'</h3><div class="stat">'+s.min+' 分钟</div><p>已听 '+s.done+' 节</p><p class="muted">'+(s.resume?'最近：《'+s.resume.title+'》 第'+(s.resume.lesson+1)+'节':'还没有收听记录')+'</p></div>'}).join('')}
var bible=['创世记','出埃及记','利未记','民数记','申命记','约书亚记','士师记','路得记','诗篇','箴言','以赛亚书','马太福音','马可福音','路加福音','约翰福音','使徒行传','罗马书','哥林多前书','哥林多后书','以弗所书','腓立比书','歌罗西书','启示录'];function renderBible(){bibleBooks.innerHTML=bible.map(b=>'<button onclick="pickBible(\''+b+'\')">'+b+'</button>').join('');pickBible(state[role].bible[0])}function pickBible(b){var max=b=='诗篇'?150:b=='创世记'?50:b=='约翰福音'?21:28,h='<h3>'+b+'</h3>';for(var i=1;i<=max;i++)h+='<button class="btn alt" onclick="listenBible(\''+b+'\','+i+')">'+i+'</button>';chapters.innerHTML=h}function listenBible(b,ch){state[role].bible=[b,ch];save();speechSynthesis.cancel();var u=new SpeechSynthesisUtterance('现在准备收听'+b+'第'+ch+'章。完整公开领域经文音频仍在接入中。');u.lang='zh-CN';speechSynthesis.speak(u);renderHome()}
function go(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');if(id=='family')renderFamily();if(id=='library'){renderCats();renderLibrary()}}function renderAll(){renderRoles();renderHome();renderCats();renderLibrary();renderFamily();renderDash();renderBible()}renderAll();
</script></body></html>
