<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6efe4"><link rel="manifest" href="manifest.webmanifest"><title>我们家的慢慢成长</title><style>body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui;background:#f7f1e8;color:#2d2926}.app{max-width:900px;margin:auto;padding:24px}.hero{background:linear-gradient(145deg,#fffaf2,#e9f0e6);border:1px solid #e9ded0;border-radius:28px;padding:28px}.hero h1{font-size:42px;margin:8px 0}.roles,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.role,.card{background:#fffaf3;border:1px solid #e9ded0;border-radius:20px;padding:18px}.role{font-size:18px;cursor:pointer}.role.on{outline:3px solid #78957c}.btn{border:0;border-radius:13px;padding:12px 16px;background:#31493a;color:#fff;font-size:16px;cursor:pointer}.muted{color:#786f67;line-height:1.7}.resume{margin-top:18px;background:#2e4b39;color:white;border-radius:22px;padding:20px}.nav{display:flex;gap:8px;overflow:auto;padding:14px 0}.nav button{white-space:nowrap;border:0;border-radius:999px;padding:10px 14px;background:white}.section{display:none}.section.on{display:block}.bar{height:10px;background:#eee5da;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#6e8b74}.lesson{border-top:1px solid #e9ded0;padding:12px 0}.player{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(92%,700px);background:#26382d;color:white;padding:12px;border-radius:18px;display:none}.player.show{display:block}@media(max-width:600px){.app{padding:12px}.hero h1{font-size:32px}.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><section class="hero"><div>🌿 FAMILY HUB · V7 ONLINE</div><h1>我们家的慢慢成长</h1><p class="muted">不是作业，是一家人慢慢重新认识彼此的地方。听一点、读一点、看看家里的近况，就很好。</p><div class="roles" id="roles"></div></section><nav class="nav"><button onclick="go('home')">🏠 首页</button><button onclick="go('listen')">🎧 听书</button><button onclick="go('bible')">✝️ 圣经</button><button onclick="go('music')">🎵 赞美诗</button><button onclick="go('family')">📸 家庭动态</button><button onclick="go('dash')">📊 全家进度</button></nav><section id="home" class="section on"></section><section id="listen" class="section"><h2>🎧 爸妈大学</h2><p class="muted">点一门课后可以连续听。正式长音频会继续升级为 MP3 锁屏播放器。</p><div id="courses" class="grid"></div></section><section id="bible" class="section"><h2>✝️ 听圣经</h2><div class="card"><p class="muted">圣经区保留为完整 66 卷播放器入口。当前在线版先提供快速入口，下一次更新继续接入逐章阅读与连续播放。</p><button class="btn" onclick="window.open('https://ebible.org/cmn-cu89s/','_blank')">📖 阅读新标点和合本</button></div></section><section id="music" class="section"><h2>🎵 赞美诗</h2><div class="card"><h3>工作时听 · 安静敬拜</h3><p class="muted">为了避免失效的嵌入播放器，在线版先使用赞美之泉官方入口。</p><button class="btn" onclick="window.open('https://www.youtube.com/@StreamofPraise','_blank')">▶ 打开赞美之泉官方频道</button></div></section><section id="family" class="section"><h2>📸 我们家的最近</h2><div class="card"><textarea id="post" style="width:100%;min-height:100px;border:1px solid #ddd;border-radius:12px;padding:10px" placeholder="写一句最近发生的小事……"></textarea><p><button class="btn" onclick="addPost()">发布家庭动态</button></p><div id="posts"></div></div></section><section id="dash" class="section"><h2>📊 全家成长看板</h2><div id="dashboard" class="grid"></div></section></main><div class="player" id="player"><b id="pt">正在播放</b><div id="ps" style="font-size:13px;opacity:.8;margin:5px 0"></div><button onclick="speechSynthesis.pause()">⏸</button> <button onclick="speechSynthesis.resume()">▶</button> <button onclick="speechSynthesis.cancel();player.classList.remove('show')">■</button></div><script>const people={dad:['爸爸','👨'],mom:['妈妈','👩'],bro:['老弟','🧑'],me:['我','👧']};let role=localStorage.familyRole||'dad';let data=JSON.parse(localStorage.familyV7Online||'{"dad":{"min":0,"done":0},"mom":{"min":0,"done":0},"bro":{"min":0,"done":0},"me":{"min":0,"done":0},"posts":[]}');const courses=[['💞','夫妻之间怎么把话说清楚',['先听完再回答','少一点指责，多一点描述','吵架时先处理情绪','表达需要，不猜心','道歉不是认输','夫妻是队友，不是对手','钱怎么谈才不伤感情','忙的时候也要有回应','怎样表达感谢','旧账为什么越翻越伤','建立两个人的小习惯','一起想象退休后的生活']],['👨‍👩‍👧','父母的觉醒',['孩子不是父母的成绩单','焦虑为什么会变成控制','先连接，再纠正','听完孩子的话再给建议','允许孩子和自己不同','少问成绩，多问生活','孩子沉默时怎么办','父母也可以承认不知道','边界不是冷漠','如何修复说重的话','孩子长大后的亲子关系','让家成为愿意回来的地方']],['🧑‍🎓','青春期男孩',['青春期的大脑正在发生什么','为什么越来越需要自己的空间','顶嘴背后可能是什么','别把沉默当成不孝','朋友为什么越来越重要','手机和游戏怎么谈','规则要少而清楚','父亲怎样参与男孩成长','妈妈怎样减少焦虑式追问','犯错也是学习责任的机会','谈恋爱和性教育怎么开口','怎样谈未来而不是逼未来','冲突以后如何重新连接','从管理孩子走向陪伴成长']],['💰','家庭理财与安心养老',['先弄清楚钱去了哪里','家庭应急金怎么准备','储蓄不是剩下才存','避免看不懂的高风险投资','保险到底解决什么问题','夫妻要知道彼此的财务情况','给孩子钱也要有边界','退休生活需要多少钱','医疗和长期照护要提前想','防诈骗是养老必修课','简单投资比频繁操作更重要','把退休后的生活也规划进去']],['🌱','50岁以后继续成长',['人到中年也可以重新学习','不要把全部生活都放在孩子身上','培养一个自己的爱好','身体健康是最重要的资产','夫妻关系需要重新经营','学会使用新工具但不被短视频绑架','保持朋友和教会连接','允许自己休息','学习表达感受','给未来留下期待','记录自己的故事','慢慢成为自己喜欢的大人']]];function save(){localStorage.familyV7Online=JSON.stringify(data)}function renderRoles(){roles.innerHTML=Object.entries(people).map(([k,v])=>`<button class="role ${role===k?'on':''}" onclick="setRole('${k}')">${v[1]} ${v[0]}</button>`).join('')}function setRole(r){role=r;localStorage.familyRole=r;render();go('home')}function go(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');scrollTo({top:0,behavior:'smooth'})}function home(){let p=people[role],d=data[role];home.innerHTML=`<div class="resume"><small>${p[1]} ${p[0]}，今天辛苦了</small><h2>${role==='bro'?'这里不是监督区，想听什么就听什么。':role==='me'?'欢迎回来，这里是你的家庭后台。':'不用学很多，戴上耳机听一点就好。'}</h2><button class="btn" onclick="go('listen')">▶ 今天听一点</button></div><div class="grid"><div class="card"><h3>🎧 工作的时候听</h3><p class="muted">夫妻、亲子、青春期、养老理财、自我成长。</p><button class="btn" onclick="go('listen')">进入爸妈大学</button></div><div class="card"><h3>✝️ 今天听一章圣经</h3><p class="muted">安静一点，慢慢听。</p><button class="btn" onclick="go('bible')">打开圣经</button></div><div class="card"><h3>🎵 放点赞美诗</h3><p class="muted">上班、做饭、休息的时候都可以。</p><button class="btn" onclick="go('music')">听赞美诗</button></div><div class="card"><h3>📸 看看家里</h3><p class="muted">把平时不知道怎么说的话，慢慢留在这里。</p><button class="btn" onclick="go('family')">家庭动态</button></div></div>`}function renderCourses(){courses.innerHTML=courses.map((c,i)=>`<div class="card"><div style="font-size:34px">${c[0]}</div><h3>${c[1]}</h3><p class="muted">${c[2].length} 节 · 可连续收听</p><button class="btn" onclick="play(${i},0)">▶ 从第1节开始</button><details><summary style="margin-top:12px">查看全部章节</summary>${c[2].map((x,j)=>`<div class="lesson">${j+1}. ${x} <button onclick="play(${i},${j})">▶</button></div>`).join('')}</details></div>`).join('')}function lessonText(ci,li){let t=courses[ci][2][li];return `欢迎来到我们家的慢慢成长。今天这一节叫做，${t}。我们先不急着讲大道理。很多家庭的问题，并不是谁不爱谁，而是大家太忙、太累，又不知道怎样把心里的话说清楚。今天只记住一件事：先听，再判断；先理解，再给建议。家人不是需要被赢过的人，而是需要被听见的人。今天试试看，当家人说一件事情的时候，先别马上告诉他应该怎么做。先问一句：你现在是想让我听听，还是想让我一起想办法？一个小小的变化，就可能让下一次谈话不一样。`}function play(ci,li){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lessonText(ci,li));u.lang='zh-CN';u.rate=.82;let start=Date.now();u.onend=()=>{data[role].min+=Math.max(1,Math.round((Date.now()-start)/60000));data[role].done++;save();renderDash();if(li+1<courses[ci][2].length)setTimeout(()=>play(ci,li+1),500)};speechSynthesis.speak(u);pt.textContent=courses[ci][1];ps.textContent=`第 ${li+1}/${courses[ci][2].length} 节 · ${courses[ci][2][li]}`;player.classList.add('show')}function addPost(){let v=post.value.trim();if(!v)return;data.posts.unshift({r:role,t:v,d:new Date().toLocaleString('zh-CN')});post.value='';save();renderPosts()}function renderPosts(){posts.innerHTML=data.posts.map(x=>`<div class="lesson"><b>${people[x.r][1]} ${people[x.r][0]}</b> · <small>${x.d}</small><div style="margin-top:6px">${x.t.replace(/[<>&]/g,'')}</div></div>`).join('')||'<p class="muted">还没有动态。</p>'}function renderDash(){dashboard.innerHTML=Object.entries(people).map(([k,v])=>{let d=data[k];return `<div class="card"><h3>${v[1]} ${v[0]}</h3><b style="font-size:28px">${d.min||0}</b> 分钟 · 完成 ${d.done||0} 节<div class="bar"><i style="width:${Math.min(100,(d.done||0)*3)}%"></i></div></div>`}).join('')}function render(){renderRoles();home();renderCourses();renderPosts();renderDash()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
