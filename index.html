<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我们家的慢慢成长</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",system-ui;background:#f7f1e8;color:#292522}.app{max-width:1180px;margin:auto;padding:18px}.hero,.card{background:#fffaf3;border:1px solid #e5d9c9;border-radius:22px}.hero{padding:24px;background:linear-gradient(145deg,#fffaf2,#e6efe4)}h1{font-size:38px;margin:8px 0}.muted{color:#756b62;line-height:1.7}.roles,.nav,.cats{display:flex;gap:8px;overflow:auto;flex-wrap:wrap}.role,.nav button,.cats button{border:0;border-radius:999px;background:#fff;padding:11px 15px;white-space:nowrap;cursor:pointer}.role.on,.cats button.on{background:#31513d;color:#fff}.nav{position:sticky;top:0;padding:12px 0;background:#f7f1e8ee;z-index:5}.section{display:none}.section.on{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:18px}.tag{display:inline-block;background:#e4eee3;border-radius:999px;padding:5px 9px;font-size:12px}.btn{border:0;border-radius:12px;padding:10px 13px;background:#31513d;color:#fff;margin:3px;cursor:pointer}.btn.alt{background:#efe2d1;color:#352d28}.lessons{display:none}.lesson,.post{border-top:1px solid #eadfd2;padding:9px 0}.resume{background:#294637;color:#fff;border-radius:20px;padding:18px;margin:12px 0}.player{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(94%,760px);background:#24392d;color:#fff;border-radius:18px;padding:13px;display:none;z-index:10}.upload{border:2px dashed #d6c8b8;border-radius:16px;padding:14px;margin:12px 0}.media{max-width:100%;max-height:340px;border-radius:12px}.stat{font-size:28px;font-weight:700}.books{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.books button{border:1px solid #ddd0c0;background:white;border-radius:10px;padding:9px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}.books{grid-template-columns:repeat(3,1fr)}h1{font-size:29px}.app{padding:11px}}</style></head><body><main class="app"><div class="hero"><div>🌿 FAMILY HUB · 我们家的慢慢成长</div><h1>一家人，慢慢认识彼此</h1><p class="muted">先选“我是谁”。每个人有自己的首页、分类书库和收听记录。</p><div class="roles" id="roles"></div></div><nav class="nav"><button onclick="go('home')">🏠 我的首页</button><button onclick="go('library')">🎧 我的书库</button><button onclick="go('bible')">✝️ 圣经</button><button onclick="go('music')">🎵 赞美诗</button><button onclick="go('family')">📸 看看家里</button><button onclick="go('dash')">📊 全家看板</button></nav><section id="home" class="section on"></section><section id="library" class="section"><h2 id="libTitle"></h2><div class="cats" id="cats"></div><div class="grid" id="grid"></div></section><section id="bible" class="section"><h2>✝️ 圣经 · 按书卷听</h2><p class="muted">选择书卷和章节；网页会记住每个人上次听到的位置。</p><div class="card"><div class="books" id="bibleBooks"></div><div id="chapters" style="margin-top:12px"></div></div></section><section id="music" class="section"><h2>🎵 赞美诗</h2><div class="grid"><div class="card"><h3>🙏 安静敬拜</h3><p>适合灵修、休息和睡前。</p></div><div class="card"><h3>🌅 上班听</h3><p>适合工作时连续播放。</p></div><div class="card"><h3>❤️ 感恩与祷告</h3><p>适合祷告和家庭安静时间。</p></div></div></section><section id="family" class="section"><h2>📸 看看家里</h2><p class="muted" id="familyHint"></p><div class="card"><textarea id="postText" style="width:100%;min-height:75px;border:1px solid #ddd0c0;border-radius:12px;padding:10px" placeholder="分享一句最近发生的小事……"></textarea><div class="upload">📷 照片 / 🎬 视频 <input id="media" type="file" accept="image/*,video/*"></div><button class="btn" onclick="addPost()">发布我的最近</button><div id="posts"></div></div></section><section id="dash" class="section"><h2>📊 全家成长看板</h2><div class="grid" id="dashGrid"></div></section></main><div class="player" id="player"><b id="pt"></b><div id="ps"></div><button class="btn alt" onclick="speechSynthesis.pause()">⏸</button><button class="btn alt" onclick="speechSynthesis.resume()">▶</button><button class="btn alt" onclick="nextLesson()">⏭</button><button class="btn alt" onclick="speechSynthesis.cancel();player.style.display='none'">■</button></div><script>var people={dad:['爸爸','👨'],mom:['妈妈','👩'],bro:['老弟','🧑'],me:['我','👧']};var role=localStorage.familyRole||'me',filter='全部',cur=null;var state=JSON.parse(localStorage.familyHubV11||'{}');Object.keys(people).forEach(function(k){if(!state[k])state[k]={min:0,done:0,history:[],resume:null,bible:['约翰福音',1]}});if(!state.posts)state.posts=[];var shared=[['沟通','💬','非暴力沟通家庭课',14],['婚姻','💞','幸福的婚姻家庭课',12],['婚姻','❤️','爱的五种语言家庭课',12],['亲子','🌱','父母的觉醒家庭课',12],['亲子','👂','如何说孩子才会听家庭课',12],['亲子','🌳','园丁与木匠家庭课',12],['青春期','🧑‍🎓','解码青春期家庭课',14],['青春期','🗣️','青春期关键对话家庭课',14],['理财','🐶','小狗钱钱家庭理财课',12],['理财','💰','金钱心理学家庭课',12],['理财','🏡','安心养老家庭课',12],['成长','🔁','习惯的力量家庭课',12],['成长','📖','如何阅读一本书家庭课',12],['成长','🌿','50岁以后继续成长',12],['成长','✨','5%的改变家庭课',12],['学习','🎯','专注力练习',12]];var personal={dad:[['夫妻','🤝','怎么和妻子好好说话',12],['家庭担当','👨‍👩‍👧','做一个好爸爸',12],['家庭担当','💍','做一个可靠的丈夫',12],['健康','🚭','少一点烟酒，多一点健康',12],['健康','❤️','中年男性健康管理',12]],mom:[['夫妻','💞','怎么和丈夫好好沟通',12],['自我','👩','做妈妈，也做自己',12],['健康','🍲','家常饮食与健康生活',12],['健康','🥣','煲汤与营养的正确打开方式',12],['自我','🌷','中年女性的自我照顾',12]],bro:[['父母沟通','🗣️','怎么和父母正确沟通',12],['青春期','🌱','青春期：慢慢长成自己',12],['学习','🎮','学习和玩怎么平衡',12],['关系','❤️','青春萌动与喜欢一个人',12],['成长','🌍','把青少年生活变丰富',12],['成长','🧭','独立、责任与未来选择',12]],me:[['AI学习','🤖','20几岁女生的AI学习路线',12],['学习','🎯','专注力与高效学习',12],['职场','💼','职场成长：从执行到分析',12],['表达','🗣️','情商、表达与自信',12],['情绪','🌙','减少内耗与情绪困扰',12],['成长','🌸','20几岁：丰富自己的人生',12],['职场','📈','建立可迁移的职业能力',12],['自我','✨','自信、边界与独立感',12]]};var themes=['先看见问题，不急着责怪','把事实和评价分开','听见自己的感受','找到真正的需要','把要求变成具体请求','先听完再回答','冲突时先暂停','理解不等于同意','温和也可以有边界','把大道理变成小行动','具体表达感谢','把改变放进日常','复盘而不是自责','修复以后继续向前'];function save(){localStorage.familyHubV11=JSON.stringify(state)}function courses(){return personal[role].concat(shared)}function renderRoles(){roles.innerHTML=Object.keys(people).map(function(k){return '<button class="role '+(k==role?'on':'')+'" onclick="setRole(\''+k+'\')">'+people[k][1]+' '+people[k][0]+'</button>'}).join('')+'<button class="role" onclick="location.href=\'guest.html\'">👤 访客</button>'}function setRole(k){role=k;localStorage.familyRole=k;filter='全部';renderAll()}function otherNames(){return Object.keys(people).filter(function(k){return k!=role}).map(function(k){return people[k][1]+people[k][0]+'最近'}).join('　')}function renderHome(){var r=state[role].resume,h='<h2>'+people[role][1]+' '+people[role][0]+'，今天想听点什么？</h2>';if(r)h+='<div class="resume">🎧 <b>继续上次听的</b><br>'+r.title+' · 第'+(r.lesson+1)+'节<br><button class="btn alt" onclick="play('+r.course+','+r.lesson+')">▶ 继续播放</button></div>';h+='<div class="grid"><div class="card"><h3>🎧 分类书库</h3><p>先选大方向，再选课程和章节。</p><button class="btn" onclick="go(\'library\')">打开书库</button></div><div class="card"><h3>✝️ 今天听一章圣经</h3><p>'+state[role].bible[0]+' 第'+state[role].bible[1]+'章</p><button class="btn" onclick="go(\'bible\')">继续</button></div><div class="card"><h3>📸 看看家里</h3><p>'+otherNames()+'</p><button class="btn" onclick="go(\'family\')">看看最近</button></div></div>';home.innerHTML=h}function renderCats(){var cs=['全部'].concat(Array.from(new Set(courses().map(function(x){return x[0]}))));cats.innerHTML=cs.map(function(c){return '<button class="'+(c==filter?'on':'')+'" onclick="filter=\''+c+'\';renderCats();renderLibrary()">'+c+'</button>'}).join('')}function renderLibrary(){libTitle.textContent='🎧 '+people[role][1]+' '+people[role][0]+'的分类书库';var a=courses(),h='';for(var i=0;i<a.length;i++){var x=a[i];if(filter!='全部'&&x[0]!=filter)continue;h+='<div class="card"><span class="tag">'+x[0]+' · '+x[3]+'节</span><h3>'+x[1]+' '+x[2]+'</h3><button class="btn" onclick="play('+i+',0)">▶ 从头听</button><button class="btn alt" onclick="toggle('+i+',this)">📚 查看章节</button><div class="lessons"></div></div>'}grid.innerHTML=h}function toggle(i,b){var box=b.nextElementSibling;if(box.style.display=='block'){box.style.display='none';return}var x=courses()[i],h='';for(var j=0;j<x[3];j++)h+='<div class="lesson">第'+(j+1)+'节 · '+themes[j%themes.length]+' <button class="btn alt" onclick="play('+i+','+j+')">▶</button></div>';box.innerHTML=h;box.style.display='block'}function play(i,j){speechSynthesis.cancel();var x=courses()[i];cur=[i,j];state[role].resume={course:i,lesson:j,title:x[2]};state[role].history.unshift(x[2]+' · 第'+(j+1)+'节');state[role].history=state[role].history.slice(0,30);state[role].done++;state[role].min+=6;save();pt.textContent='🎧 '+x[2];ps.textContent='第'+(j+1)+'/'+x[3]+'节 · '+themes[j%themes.length];player.style.display='block';var u=new SpeechSynthesisUtterance('欢迎来到'+x[2]+'第'+(j+1)+'节，'+themes[j%themes.length]+'。今天不考试，只练一个能用在生活里的小方法。先想一个最近真实发生的场景，不急着判断谁对谁错，把事实、感受和真正需要分开。改变不需要一次做到满分，只要选择一个今天能做到的小动作。少一句指责，多问一个问题；少一点猜测，多一次确认。今天试试看，把你最想改善的一件事，用一句具体、温和、能做到的话说出来。');u.lang='zh-CN';u.rate=.9;u.onend=function(){if(j+1<x[3])play(i,j+1)};speechSynthesis.speak(u);renderHome();renderDash()}function nextLesson(){if(cur&&cur[1]+1<courses()[cur[0]][3])play(cur[0],cur[1]+1)}function renderFamily(){familyHint.textContent='这里主要看其他家人的最近：'+otherNames()+'。';var arr=state.posts.filter(function(p){return p.role!=role});posts.innerHTML=arr.length?arr.map(function(p){return '<div class="post"><b>'+people[p.role][1]+' '+people[p.role][0]+'</b> · '+p.time+'<p>'+p.text+'</p>'+(p.media||'')+'</div>'}).join(''):'<p class="muted">其他家人还没有发布最近动态。</p>'}function addPost(){var text=postText.value.trim(),f=media.files[0];function done(m){state.posts.unshift({role:role,text:text||'分享了一个最近瞬间',time:new Date().toLocaleString(),media:m||''});save();postText.value='';media.value='';renderFamily()}if(!f)return done('');var r=new FileReader();r.onload=function(){done(f.type.indexOf('video')==0?'<video class="media" controls src="'+r.result+'"></video>':'<img class="media" src="'+r.result+'">')};r.readAsDataURL(f)}function renderDash(){dashGrid.innerHTML=Object.keys(people).map(function(k){var s=state[k];return '<div class="card"><h3>'+people[k][1]+' '+people[k][0]+'</h3><div class="stat">'+s.min+' 分钟</div><p>已听 '+s.done+' 节</p><p class="muted">'+(s.resume?'最近：'+s.resume.title+' 第'+(s.resume.lesson+1)+'节':'还没有收听记录')+'</p></div>'}).join('')}var bible=['创世记','出埃及记','利未记','民数记','申命记','约书亚记','士师记','路得记','诗篇','箴言','以赛亚书','马太福音','马可福音','路加福音','约翰福音','使徒行传','罗马书','哥林多前书','哥林多后书','以弗所书','腓立比书','歌罗西书','启示录'];function renderBible(){bibleBooks.innerHTML=bible.map(function(b){return '<button onclick="pickBible(\''+b+'\')">'+b+'</button>'}).join('');pickBible(state[role].bible[0])}function pickBible(b){var max=b=='诗篇'?150:b=='创世记'?50:b=='约翰福音'?21:28,h='<h3>'+b+'</h3>';for(var i=1;i<=max;i++)h+='<button class="btn alt" onclick="listenBible(\''+b+'\','+i+')">'+i+'</button>';chapters.innerHTML=h}function listenBible(b,ch){state[role].bible=[b,ch];save();speechSynthesis.cancel();var u=new SpeechSynthesisUtterance('现在准备收听'+b+'第'+ch+'章。完整公开领域经文正在接入本站音频库。');u.lang='zh-CN';speechSynthesis.speak(u);renderHome()}function go(id){document.querySelectorAll('.section').forEach(function(s){s.classList.remove('on')});document.getElementById(id).classList.add('on');if(id=='family')renderFamily();if(id=='library'){renderCats();renderLibrary()}}function renderAll(){renderRoles();renderHome();renderCats();renderLibrary();renderFamily();renderDash();renderBible()}renderAll();</script></body></html>
