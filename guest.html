<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4eee4"><title>访客听书馆｜慢慢成长</title><style>*{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#f7f1e8;color:#292522}.app{max-width:1180px;margin:auto;padding:18px}.hero,.card{background:#fffaf3;border:1px solid #e5d9c9;border-radius:24px}.hero{padding:25px;background:linear-gradient(145deg,#fffaf2,#e6efe4)}h1{font-size:38px;margin:8px 0}.muted{color:#756b62;line-height:1.7}.privacy{background:#edf4eb;border-radius:16px;padding:13px;margin-top:14px}.tabs{display:flex;gap:8px;overflow:auto;position:sticky;top:0;padding:12px 0;background:#f7f1e8ee;z-index:4}.tabs button{white-space:nowrap;border:0;border-radius:999px;background:#fff;padding:11px 15px;cursor:pointer}.tabs button.on{background:#31513d;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:18px}.tag{display:inline-block;background:#e4eee3;border-radius:999px;padding:5px 9px;font-size:12px}.btn{border:0;border-radius:12px;padding:11px 14px;background:#31513d;color:#fff;cursor:pointer;margin:3px}.btn.alt{background:#efe2d1;color:#352d28}.lesson{border-top:1px solid #eadfd2;padding:10px 0}.player{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(94%,760px);background:#24392d;color:#fff;border-radius:18px;padding:13px 15px;display:none;z-index:10}.player.on{display:block}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.controls button{border:0;border-radius:9px;padding:8px 11px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{padding:11px}h1{font-size:29px}.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="hero"><div>🌿 慢慢成长 · 访客听书馆</div><h1>欢迎来坐坐，挑一个想听的主题</h1><p class="muted">这里是公开访客空间：可以听沟通、婚姻、亲子、青春期、健康、饮食、理财、自我成长等内容。</p><div class="privacy">🔒 <b>隐私模式</b>：访客看不到家庭动态、照片、视频、留言、家庭成员学习记录或全家看板，也不能进入家庭后台。访客的收听记录只保存在访客自己的设备。</div></div><div class="tabs" id="tabs"></div><h2 id="courseTitle">🎧 全部公开课程</h2><div class="grid" id="courseGrid"></div></main><div class="player" id="audioPlayer"><b id="playerTitle">正在播放</b><div id="playerSub" style="opacity:.8;font-size:13px;margin-top:4px"></div><div class="controls"><button onclick="prevLesson()">⏮</button><button onclick="speechSynthesis.pause()">⏸</button><button onclick="speechSynthesis.resume()">▶</button><button onclick="nextLesson()">⏭</button><button onclick="stopAudio()">■</button><select id="speed"><option value=".8">0.8×</option><option value=".9" selected>0.9×</option><option value="1">1.0×</option><option value="1.15">1.15×</option></select></div></div><script>const courses=[['沟通','💬','《非暴力沟通》家庭课',14],['婚姻','💞','《幸福的婚姻》家庭课',12],['婚姻','❤️','《爱的五种语言》家庭课',12],['亲子','🌱','《父母的觉醒》家庭课',12],['亲子','👂','《如何说孩子才会听》家庭课',12],['亲子','🌳','《园丁与木匠》家庭课',12],['青春期','🧑‍🎓','《解码青春期》家庭课',14],['青春期','🗣️','《青春期关键对话》家庭课',14],['理财','🐶','《小狗钱钱》家庭理财课',12],['理财','💰','《金钱心理学》家庭课',12],['健康','🏡','《安心养老》家庭课',12],['成长','🔁','《习惯的力量》家庭课',12],['成长','📖','《如何阅读一本书》家庭课',12],['成长','🌿','《50岁以后继续成长》',12],['成长','✨','《5%的改变》家庭课',12],['学习','🎯','《专注力练习》',12],['沟通','🤝','夫妻好好说话',12],['亲子','👨‍👩‍👧','父母和孩子正确沟通',12],['健康','❤️','少一点烟酒，多一点健康',12],['健康','🍲','家常饮食与健康生活',12],['成长','🗣️','情商、表达与自信',12],['成长','🌙','减少内耗与情绪困扰',12]];const lessonThemes=['先看见问题，而不是急着责怪','事实和评价要分开','听见自己的感受','找到真正的需要','把要求变成具体请求','先听完，再回答','冲突时给彼此一点暂停','理解不等于同意','边界也可以温和','把大道理变成一个小行动','练习具体地表达感谢','做不到满分也可以继续','把改变放进日常生活','回顾、修复与继续成长'];let filter='全部',cur=null;const tabsEl=document.getElementById('tabs'),gridEl=document.getElementById('courseGrid'),titleEl=document.getElementById('courseTitle'),player=document.getElementById('audioPlayer'),pt=document.getElementById('playerTitle'),ps=document.getElementById('playerSub'),speed=document.getElementById('speed');const cats=['全部',...new Set(courses.map(x=>x[0]))];function renderTabs(){tabsEl.innerHTML=cats.map(x=>`<button class="${filter===x?'on':''}" data-cat="${x}">${x}</button>`).join('');tabsEl.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.cat;renderTabs();renderCourses()}))}function names(n){return Array.from({length:n},(_,i)=>lessonThemes[i%lessonThemes.length])}function renderCourses(){titleEl.textContent=filter==='全部'?'🎧 全部公开课程':'🎧 '+filter;const a=courses.map((x,i)=>[x,i]).filter(([x])=>filter==='全部'||x[0]===filter);gridEl.innerHTML=a.map(([x,i])=>`<article class="card"><span class="tag">${x[0]}</span><h3>${x[1]} ${x[2]}</h3><p class="muted">${x[3]} 节 · 可逐节播放 / 连续听</p><button class="btn" onclick="play(${i},0)">🔊 连续听</button><button class="btn alt" onclick="toggleLessons(${i},this)">📚 查看章节</button><div class="lessonBox"></div></article>`).join('')}function toggleLessons(i,b){const box=b.nextElementSibling;if(box.innerHTML){box.innerHTML='';return}const x=courses[i];box.innerHTML=names(x[3]).map((t,j)=>`<div class="lesson">第${j+1}节 · ${t} <button class="btn alt" onclick="play(${i},${j})">▶ 听</button></div>`).join('')}function scriptText(x,j){const t=names(x[3])[j];return `欢迎来到${x[2]}第${j+1}节：${t}。这里不是在朗读受版权保护书籍的全文，而是根据这个主题制作的家庭学习课程。今天先从一个生活里的具体场景开始。不要急着判断谁对谁错，先把发生的事实、自己的感受和真正需要分开。很多改变并不需要一次做到满分，只需要选择一个今天能完成的小动作。比如少一句指责，多一个问题；少一点猜测，多一次确认；少刷十分钟手机，多做十分钟真正重要的事情。现在想一个最近真实发生的场景，再问自己：我真正希望改善的是什么？我今天能做的最小一步是什么？把答案说得具体一点，然后去试一次。改变不是突然变成另一个人，而是一次比一次更会看见自己，也更会理解别人。`; }function play(i,j){stopAudio();cur={i,j};localStorage.setItem('guestResumeV2',JSON.stringify(cur));const x=courses[i];pt.textContent='🎧 '+x[2];ps.textContent=`第${j+1}/${x[3]}节 · ${names(x[3])[j]}`;player.classList.add('on');const u=new SpeechSynthesisUtterance(scriptText(x,j));u.lang='zh-CN';u.rate=Number(speed.value);u.onend=()=>{if(cur&&cur.i===i&&cur.j===j&&j+1<x[3])play(i,j+1)};speechSynthesis.speak(u)}function stopAudio(){speechSynthesis.cancel()}function nextLesson(){if(cur&&cur.j+1<courses[cur.i][3])play(cur.i,cur.j+1)}function prevLesson(){if(cur&&cur.j>0)play(cur.i,cur.j-1)}renderTabs();renderCourses();try{const q=JSON.parse(localStorage.getItem('guestResumeV2')||'null');if(q&&courses[q.i]){const d=document.createElement('div');d.className='privacy';d.innerHTML=`🎧 上次听到：${courses[q.i][2]} · 第${q.j+1}节　<button class="btn" id="resumeBtn">继续播放 ▶</button>`;document.querySelector('.hero').appendChild(d);document.getElementById('resumeBtn').onclick=()=>play(q.i,q.j)}}catch(e){console.warn(e)}</script></body></html>
