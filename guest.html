<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>访客听书馆｜慢慢成长</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei",system-ui;background:#f7f1e8;color:#292522}.app{max-width:1180px;margin:auto;padding:18px}.hero,.card{background:#fffaf3;border:1px solid #e5d9c9;border-radius:22px}.hero{padding:25px;background:linear-gradient(145deg,#fffaf2,#e6efe4)}h1{font-size:38px;margin:8px 0}.muted{color:#756b62;line-height:1.7}.privacy{background:#edf4eb;border-radius:16px;padding:13px;margin-top:14px}.cats{display:flex;gap:8px;overflow:auto;padding:16px 0;position:sticky;top:0;background:#f7f1e8ee;z-index:3}.cats button{border:0;border-radius:999px;background:#fff;padding:11px 15px;white-space:nowrap}.cats button.on{background:#31513d;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:18px}.tag{display:inline-block;background:#e4eee3;border-radius:999px;padding:5px 9px;font-size:12px}.btn{border:0;border-radius:12px;padding:10px 13px;background:#31513d;color:#fff;margin:3px;cursor:pointer}.btn.alt{background:#efe2d1;color:#352d28}.lessons{display:none;margin-top:8px}.lesson{border-top:1px solid #eadfd2;padding:9px 0}.player{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(94%,760px);background:#24392d;color:#fff;border-radius:18px;padding:13px;display:none;z-index:10}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:29px}}</style></head><body><main class="app"><div class="hero"><div>🌿 慢慢成长 · 访客听书馆</div><h1>欢迎来坐坐，挑一个想听的主题</h1><p class="muted">公开课程按大方向整理。先选分类，再挑课程，再按章节听。</p><div class="privacy">🔒 访客只能使用公开听书馆，看不到家庭照片、视频、留言、学习记录和家庭后台。</div></div><div class="cats"><button class="on" onclick="filterCat('全部',this)">全部</button><button onclick="filterCat('沟通',this)">💬 沟通</button><button onclick="filterCat('婚姻',this)">💞 婚姻</button><button onclick="filterCat('亲子',this)">👨‍👩‍👧 亲子</button><button onclick="filterCat('青春期',this)">🧑‍🎓 青春期</button><button onclick="filterCat('理财',this)">💰 理财养老</button><button onclick="filterCat('健康',this)">🍲 健康生活</button><button onclick="filterCat('成长',this)">🌱 自我成长</button><button onclick="filterCat('学习',this)">🎯 学习专注</button></div><h2>🎧 公开课程</h2><div class="grid" id="grid"></div></main><div class="player" id="player"><b id="pt"></b><div id="ps" style="margin:5px 0;opacity:.85"></div><button class="btn alt" onclick="speechSynthesis.pause()">⏸ 暂停</button><button class="btn alt" onclick="speechSynthesis.resume()">▶ 继续</button><button class="btn alt" onclick="speechSynthesis.cancel();player.style.display='none'">■ 关闭</button></div><script>var data=[['沟通','💬','非暴力沟通家庭课',14],['沟通','🗣️','沟通的艺术家庭课',12],['婚姻','💞','幸福的婚姻家庭课',12],['婚姻','❤️','爱的五种语言家庭课',12],['亲子','🌱','父母的觉醒家庭课',12],['亲子','👂','如何说孩子才会听家庭课',12],['亲子','🌳','园丁与木匠家庭课',12],['青春期','🧑‍🎓','解码青春期家庭课',14],['青春期','🗣️','青春期关键对话家庭课',14],['理财','🐶','小狗钱钱家庭理财课',12],['理财','💰','金钱心理学家庭课',12],['理财','🏡','安心养老家庭课',12],['健康','❤️','少一点烟酒，多一点健康',12],['健康','🍲','家常饮食与健康生活',12],['成长','🔁','习惯的力量家庭课',12],['成长','📖','如何阅读一本书家庭课',12],['成长','🌿','50岁以后继续成长',12],['成长','✨','5%的改变家庭课',12],['成长','🗣️','情商、表达与自信',12],['成长','🌙','减少内耗与情绪困扰',12],['学习','🎯','专注力与高效学习',12],['学习','🧠','考试脑科学学习课',12]];var themes=['先看见问题，不急着责怪','把事实和评价分开','听见自己的感受','找到真正的需要','把要求变成具体请求','先听完再回答','冲突时先暂停','理解不等于同意','温和也可以有边界','把大道理变成小行动','具体地表达感谢','把改变放进日常','复盘而不是自责','修复以后继续向前'];function render(cat){var h='';for(var i=0;i<data.length;i++){var x=data[i];if(cat!='全部'&&x[0]!=cat)continue;h+='<article class="card"><span class="tag">'+x[0]+'</span><h3>'+x[1]+' '+x[2]+'</h3><p class="muted">'+x[3]+'节 · 可逐节听 / 连续听</p><button class="btn" onclick="play('+i+',0)">▶ 从头听</button><button class="btn alt" onclick="toggle('+i+',this)">📚 查看章节</button><div class="lessons"></div></article>'}document.getElementById('grid').innerHTML=h}function filterCat(c,b){var bs=document.querySelectorAll('.cats button');for(var i=0;i<bs.length;i++)bs[i].className='';b.className='on';render(c)}function toggle(i,b){var box=b.nextElementSibling;if(box.style.display=='block'){box.style.display='none';return}var x=data[i],h='';for(var j=0;j<x[3];j++)h+='<div class="lesson">第'+(j+1)+'节 · '+themes[j%themes.length]+' <button class="btn alt" onclick="play('+i+','+j+')">▶ 听</button></div>';box.innerHTML=h;box.style.display='block'}function play(i,j){speechSynthesis.cancel();var x=data[i],t=themes[j%themes.length];document.getElementById('pt').textContent='🎧 '+x[2];document.getElementById('ps').textContent='第'+(j+1)+'/'+x[3]+'节 · '+t;document.getElementById('player').style.display='block';localStorage.setItem('guestLast',JSON.stringify([i,j]));var u=new SpeechSynthesisUtterance('欢迎来到'+x[2]+'第'+(j+1)+'节，'+t+'。这一节我们从生活里的一个真实场景开始。先不急着判断谁对谁错，把发生的事实、自己的感受和真正需要分开。很多改变不是靠一次讲大道理，而是靠一个小动作反复练习。今天只选一件能做到的小事：少一句指责，多问一个问题；少一点猜测，多一次确认；或者给自己十分钟安静下来。今天试试看，把你最想改善的一件事，用一句具体、温和、能做到的话说出来。');u.lang='zh-CN';u.rate=.9;u.onend=function(){if(j+1<x[3])play(i,j+1)};speechSynthesis.speak(u)}render('全部');</script></body></html>
