<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4eee4"><title>访客听书馆｜慢慢成长</title><style>*{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#f7f1e8;color:#292522}.app{max-width:1200px;margin:auto;padding:18px}.hero,.card,.shelf{background:#fffaf3;border:1px solid #e5d9c9;border-radius:22px}.hero{padding:25px;background:linear-gradient(145deg,#fffaf2,#e6efe4)}h1{font-size:38px;margin:8px 0}.muted{color:#756b62;line-height:1.7}.privacy{background:#edf4eb;border-radius:16px;padding:13px;margin-top:14px}.cats{display:flex;gap:8px;overflow:auto;padding:16px 0;position:sticky;top:0;background:#f7f1e8ee;z-index:3}.cats button{border:0;border-radius:999px;background:#fff;padding:11px 15px;white-space:nowrap;cursor:pointer}.cats button.on{background:#31513d;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:18px}.tag{display:inline-block;background:#e4eee3;border-radius:999px;padding:5px 9px;font-size:12px}.btn{border:0;border-radius:12px;padding:10px 13px;background:#31513d;color:#fff;margin:3px;cursor:pointer}.btn.alt{background:#efe2d1;color:#352d28}.lessons{display:none;margin-top:8px}.lesson{border-top:1px solid #eadfd2;padding:9px 0}.shelf{padding:18px;margin:18px 0}.bookgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.book{background:white;border:1px solid #eadfd2;border-radius:15px;padding:13px;min-height:112px}.book b{display:block;margin:5px 0}.book small{color:#7b7067}.player{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(94%,760px);background:#24392d;color:#fff;border-radius:18px;padding:13px;display:none;z-index:10}.count{font-size:13px;color:#766c63;margin-bottom:12px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.bookgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.app{padding:11px}.grid,.bookgrid{grid-template-columns:1fr 1fr}h1{font-size:29px}.book{min-height:100px}}@media(max-width:390px){.bookgrid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="hero"><div>🌿 慢慢成长 · 访客听书馆</div><h1>所有书单，都放在这里慢慢听</h1><p class="muted">这是公开版家庭成长书房。你可以按亲子、家庭、沟通、心理、成长、学习、理财等方向找书，也可以直接打开“听书 / 播客课”，按章节连续听。</p><div class="privacy">🔒 访客只看到公开书单和公开学习内容；家庭照片、动态、个人进度、留言和后台仍然完全隔离。</div></div><div class="cats" id="cats"></div><section class="shelf"><h2 id="shelfTitle">📚 全部公开书单</h2><div class="count" id="count"></div><div class="bookgrid" id="bookGrid"></div></section><h2>🎧 听书 · 播客式课程</h2><p class="muted">不是盗版全文朗读，而是围绕书中公开思想和主题制作的学习型音频课程。每套可展开章节、单节听或连续听。</p><div class="grid" id="courseGrid"></div></main><div class="player" id="player"><b id="pt"></b><div id="ps" style="margin:5px 0;opacity:.85"></div><button class="btn alt" onclick="speechSynthesis.pause()">⏸ 暂停</button><button class="btn alt" onclick="speechSynthesis.resume()">▶ 继续</button><button class="btn alt" onclick="speechSynthesis.cancel();player.style.display='none'">■ 关闭</button></div><script>var books=[['亲子教育','正面管教','教育理念'],['亲子教育','被忽视的孩子','心理与养育'],['亲子教育','园丁与木匠','教育理念'],['亲子教育','美得窒息的母亲','母女关系'],['亲子教育','好妈妈胜过好老师','家庭教育'],['亲子教育','父母的语言','亲子沟通'],['亲子教育','孩子，把你的手给我','亲子沟通'],['亲子教育','如何说孩子才会听，怎么听孩子才肯说','亲子沟通'],['亲子教育','养育男孩','男孩成长'],['亲子教育','非暴力沟通·亲子篇','亲子沟通'],['亲子教育','游戏力','亲子连接'],['亲子教育','你当像鸟飞往你的山','成长与家庭'],['家庭关系','不完美的父母','育儿心理学'],['家庭关系','热锅上的家庭','家庭系统'],['家庭关系','家庭的觉醒','家庭关系'],['家庭关系','脆弱的家庭','家庭关系'],['家庭关系','成为母亲的选择','母职成长'],['家庭关系','家庭幸福的艺术','家庭经营'],['家庭关系','请停止在我身旁迷失','家庭边界'],['家庭关系','何以为父','父亲角色'],['家庭关系','高能量家庭','家庭经营'],['家庭关系','兄弟姐妹心理学','手足关系'],['家庭关系','岁月的针脚','亲情与人生'],['家庭关系','中国式家庭','家庭模式'],['心理情绪','津巴多普通心理学','心理学'],['心理情绪','被讨厌的勇气','自我成长'],['心理情绪','蛤蟆先生去看心理医生','心理疗愈'],['心理情绪','人生海海','人生韧性'],['心理情绪','人性的弱点','人际关系'],['心理情绪','简·爱','女性成长'],['心理情绪','杨绛传','女性与人生'],['心理情绪','一间只属于自己的房间','女性成长'],['成长学习','刻意练习','学习方法'],['成长学习','认知天性','学习科学'],['成长学习','考试脑科学','学习方法'],['成长学习','自驱型成长','成长动力'],['成长学习','为什么学生不喜欢上学','学习心理'],['成长学习','如何培养孩子自主学习力','学习方法'],['成长学习','微习惯','习惯'],['成长学习','打开一颗心智','认知'],['成长学习','自控力','自我管理'],['成长学习','底层逻辑','思维'],['成长学习','思考，快与慢','认知'],['成长学习','学会提问','批判思维'],['成长学习','认知觉醒','自我成长'],['沟通关系','非暴力沟通','沟通'],['沟通关系','关键对话','沟通'],['沟通关系','情绪智力','情商'],['沟通关系','别独自用餐','人际关系'],['理财人生','小狗钱钱','财商'],['理财人生','穷查理宝典','投资思维'],['理财人生','财务自由之路','理财'],['理财人生','巴菲特传','投资与人生'],['人生阅读','生命之书','哲思'],['人生阅读','人类简史','历史'],['人生阅读','中国通史','历史'],['人生阅读','明朝那些事儿','历史'],['人生阅读','历历在目','历史与人生'],['人生阅读','少有人走的路','成长'],['人生阅读','亲密关系','关系']];var courses=[['亲子教育','🌱','正面管教：温和而坚定',12],['亲子教育','👂','如何说孩子才会听',12],['亲子教育','🧒','父母的语言',12],['亲子教育','🌳','园丁与木匠',12],['亲子教育','🫶','不完美的父母',12],['亲子教育','🎈','自驱型成长',12],['家庭关系','🏠','中国式家庭：偏心、争吵与和解',12],['家庭关系','💞','家庭的觉醒',12],['家庭关系','👨‍👩‍👧','热锅上的家庭',12],['家庭关系','🤝','何以为父：父亲角色',10],['沟通关系','💬','非暴力沟通家庭课',14],['沟通关系','🗣️','关键对话家庭课',12],['沟通关系','❤️','爱的五种语言',12],['心理情绪','🌙','被讨厌的勇气：课题分离',12],['心理情绪','🐸','蛤蟆先生去看心理医生',12],['心理情绪','🧠','情绪智力与减少内耗',12],['成长学习','🎯','刻意练习与专注力',12],['成长学习','📖','认知天性：怎样学得牢',12],['成长学习','🧠','考试脑科学',12],['成长学习','✨','微习惯与5%的改变',12],['理财人生','🐶','小狗钱钱财商课',12],['理财人生','💰','穷查理宝典：理性与决策',12],['理财人生','📈','财务自由基础课',12],['人生阅读','🌍','人类简史主题导读',12],['人生阅读','📜','中国历史轻导读',12],['人生阅读','🌿','少有人走的路：成熟之旅',12]];var cats=['全部','亲子教育','家庭关系','沟通关系','心理情绪','成长学习','理财人生','人生阅读'];var currentCat='全部';var themes=['先看见问题，不急着责怪','事实和评价要分开','听见自己的感受','找到真正的需要','把要求变成具体请求','先听完，再回答','冲突时给彼此暂停','理解不等于同意','温和也可以有边界','把大道理变成一个小行动','练习具体地表达感谢','做不到满分也可以继续','把改变放进日常','回顾、修复与继续成长'];function renderCats(){document.getElementById('cats').innerHTML=cats.map(function(c){return '<button class="'+(c==currentCat?'on':'')+'" onclick="chooseCat(\''+c+'\')">'+c+'</button>'}).join('')}function chooseCat(c){currentCat=c;renderCats();renderBooks();renderCourses()}function renderBooks(){var a=books.filter(function(x){return currentCat=='全部'||x[0]==currentCat});document.getElementById('shelfTitle').textContent='📚 '+(currentCat=='全部'?'全部公开书单':currentCat+'书单');document.getElementById('count').textContent='目前收录 '+a.length+' 本 / 个主题，后续可以继续往这里加。';document.getElementById('bookGrid').innerHTML=a.map(function(x){return '<div class="book"><span class="tag">'+x[0]+'</span><b>《'+x[1]+'》</b><small>'+x[2]+'</small></div>'}).join('')}function renderCourses(){var h='';for(var i=0;i<courses.length;i++){var x=courses[i];if(currentCat!='全部'&&x[0]!=currentCat)continue;h+='<article class="card"><span class="tag">'+x[0]+'</span><h3>'+x[1]+' '+x[2]+'</h3><p class="muted">'+x[3]+' 节 · 主题导读 / 播客式收听</p><button class="btn" onclick="play('+i+',0)">▶ 从头听</button><button class="btn alt" onclick="toggle('+i+',this)">📚 查看章节</button><div class="lessons"></div></article>'}document.getElementById('courseGrid').innerHTML=h||'<div class="card">这个分类的音频课正在补充，书单已经可以浏览。</div>'}function toggle(i,b){var box=b.nextElementSibling;if(box.style.display=='block'){box.style.display='none';return}var x=courses[i],h='';for(var j=0;j<x[3];j++)h+='<div class="lesson">第'+(j+1)+'节 · '+themes[j%themes.length]+' <button class="btn alt" onclick="play('+i+','+j+')">▶ 听</button></div>';box.innerHTML=h;box.style.display='block'}function play(i,j){speechSynthesis.cancel();var x=courses[i],t=themes[j%themes.length];document.getElementById('pt').textContent='🎧 '+x[2];document.getElementById('ps').textContent='第'+(j+1)+'/'+x[3]+'节 · '+t;document.getElementById('player').style.display='block';localStorage.setItem('guestLastV12',JSON.stringify([i,j]));var text='欢迎来到《'+x[2]+'》主题学习第'+(j+1)+'节：'+t+'。这里不是原书全文朗读，而是把这个主题整理成适合通勤、做家务或休息时听的学习播客。今天先从一个真实生活场景开始。先不要急着判断自己或别人，而是观察发生了什么、自己有什么感受、真正需要什么。然后只选一个今天能完成的小行动。学习一本书，不是为了记住所有句子，而是为了让其中一个好观点真正进入生活。现在想一件最近发生的小事，问自己：如果把今天这一节用起来，我下一次可以做得哪里不一样？';var u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.9;u.onend=function(){if(j+1<x[3])play(i,j+1)};speechSynthesis.speak(u)}renderCats();renderBooks();renderCourses();</script></body></html>
