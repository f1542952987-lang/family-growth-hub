<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4eee4"><title>访客听书馆｜慢慢成长</title><style>*{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#f7f1e8;color:#292522}.app{max-width:1100px;margin:auto;padding:18px}.hero,.card{background:#fffaf3;border:1px solid #e5d9c9;border-radius:24px}.hero{padding:25px;background:linear-gradient(145deg,#fffaf2,#e6efe4)}h1{font-size:38px;margin:8px 0}.muted{color:#756b62;line-height:1.7}.privacy{background:#edf4eb;border-radius:16px;padding:13px;margin-top:14px}.tabs{display:flex;gap:8px;overflow:auto;position:sticky;top:0;padding:12px 0;background:#f7f1e8ee;z-index:4}.tabs button,.pill{white-space:nowrap;border:0;border-radius:999px;background:#fff;padding:11px 15px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:18px}.tag{display:inline-block;background:#e4eee3;border-radius:999px;padding:5px 9px;font-size:12px}.btn{border:0;border-radius:12px;padding:11px 14px;background:#31513d;color:#fff;cursor:pointer;margin:3px}.btn.alt{background:#efe2d1;color:#352d28}.lesson{border-top:1px solid #eadfd2;padding:10px 0}.player{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(94%,760px);background:#24392d;color:#fff;border-radius:18px;padding:13px 15px;display:none;z-index:10}.player.on{display:block}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.controls button{border:0;border-radius:9px;padding:8px 11px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{padding:11px}h1{font-size:29px}.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="hero"><div>🌿 慢慢成长 · 访客听书馆</div><h1>欢迎来坐坐，挑一个想听的主题</h1><p class="muted">这里是公开访客空间：可以听沟通、亲子、青春期、健康、饮食、理财、自我成长等内容。</p><div class="privacy">🔒 <b>隐私模式</b>：访客看不到家庭动态、照片、视频、留言、家庭成员学习记录或全家看板，也不能进入家庭后台。访客的收听记录只保存在访客自己的设备。</div></div><div class="tabs" id="tabs"></div><h2 id="title">🎧 全部公开课程</h2><div class="grid" id="grid"></div></main><div class="player" id="player"><b id="pt">正在播放</b><div id="ps" style="opacity:.8;font-size:13px;margin-top:4px"></div><div class="controls"><button onclick="prev()">⏮</button><button onclick="speechSynthesis.pause()">⏸</button><button onclick="speechSynthesis.resume()">▶</button><button onclick="next()">⏭</button><button onclick="stop()">■</button><select id="rate"><option value=".8">0.8×</option><option value=".9" selected>0.9×</option><option value="1">1.0×</option><option value="1.15">1.15×</option></select></div></div><script>const C=[['沟通','💬','非暴力沟通：把话说到心里',['先说事实不急着评价','情绪是提醒不是敌人','听见自己真正的需要','请求不是命令','怎样听懂对方的情绪','争吵时先暂停','不同意见不等于不爱','道歉怎样才有用','旧账为什么伤人','感谢要说具体','建立每周十分钟对话','成为同一队的人']],['夫妻','💞','夫妻好好说话',['为什么越亲越容易说重话','先听完再回答','少用你总是和你从不','沉默时怎么办','怎样谈钱','怎样谈孩子','需要帮助要说具体','吵完怎样修复','欣赏不要只放心里','边界不是冷漠','共同做家庭决定','一起规划未来']],['亲子','👨‍👩‍👧','父母和孩子正确沟通',['孩子不是父母的成绩单','焦虑为什么会变成控制','先连接再纠正','听完再给建议','少问成绩多问生活','孩子沉默时怎么办','规则少而清楚','允许孩子试错','父母说错也能修复','成年孩子需要什么','电话里少盘问多分享','让家成为愿意回来的地方']],['青春期','🧑‍🎓','看懂青春期男孩',['青春期大脑正在发生什么','为什么越来越需要隐私','顶嘴背后可能是什么','朋友为什么突然很重要','游戏和手机为什么吸引人','成绩压力怎么影响孩子','青春萌动很正常','尊重身体和关系边界','父母怎样谈恋爱话题','犯错以后怎么复盘','什么时候需要专业帮助','从管理走向教练']],['健康','❤️','少一点烟酒，多一点健康',['吸烟对身体做了什么','二手烟为什么也重要','酒精和肝脏','酒精与睡眠','烟酒与心血管','为什么戒烟很难','识别自己的触发场景','想抽烟时的替代动作','饭局怎样少喝一点','家人怎样支持不唠叨','一次没做到不等于失败','给未来十年的身体留余地']],['养生','🍲','家常饮食与健康生活',['一日三餐怎么搭配','煲汤不是越补越好','少盐也能有味道','蛋白质从哪里来','蔬菜怎样吃得够','主食怎么选','水和含糖饮料','买菜看什么','冰箱食物安全','睡眠比补品更重要','散步和力量活动','体检异常先问医生']],['理财','💰','安心养老与家庭理财',['钱去了哪里','先准备应急金','储蓄顺序','看不懂的不投','保险解决什么','夫妻财务透明','给孩子钱的边界','退休大概要准备什么','医疗照护准备','识别常见诈骗','简单理解长期投资','退休生活也要规划']],['成长','🌱','50岁以后继续成长',['中年也能重新学习','别把全部生活放孩子身上','培养自己的爱好','健康也是资产','经营夫妻关系','学一点新工具','保持社交','阅读和听书','旅行不一定昂贵','接受身体变化','提前想退休生活','继续成为自己']],['成长','🎯','专注力与高效学习',['注意力为什么越来越碎','先保护一小段专注时间','手机怎么放才不打扰','任务切小一点','番茄工作法','休息不是浪费','睡眠与记忆','主动回忆','间隔复习','减少多任务切换','给娱乐留位置','建立可持续节奏']],['成长','🗣️','情商、表达与自信',['情商不是讨好','先听懂再表达','如何说重点','拒绝也可以有礼貌','冲突时保持边界','紧张时怎么开口','别把自信等于强势','会议里如何发言','面对批评先分事实','减少过度解释','练习稳定的声音','自信来自一次次行动']],['成长','🌙','减少内耗与情绪困扰',['什么叫内耗','事实和脑补分开','停止反复审判自己','担心未来时怎么办','比较心从哪里来','允许情绪存在','把问题写下来','能控制和不能控制','建立恢复精力的小事','减少短视频后的空虚','需要帮助时找谁','把生活重新拉回今天']];let filter='全部',cur=null;const cats=['全部',...new Set(C.map(x=>x[0]))];function renderTabs(){tabs.innerHTML=cats.map(x=>`<button onclick="filter='${x}';render()">${x}</button>`).join('')}function render(){title.textContent=(filter==='全部'?'🎧 全部公开课程':'🎧 '+filter);let a=C.map((x,i)=>[x,i]).filter(([x])=>filter==='全部'||x[0]===filter);grid.innerHTML=a.map(([x,i])=>`<div class="card"><span class="tag">${x[0]}</span><h3>${x[1]} ${x[2]}</h3><p class="muted">${x[3].length} 节 · 可连续听</p><button class="btn" onclick="play(${i},0)">🔊 连续听</button><button class="btn alt" onclick="lessons(${i},this)">📚 章节</button><div></div></div>`).join('')}function lessons(i,b){let box=b.nextElementSibling;box.innerHTML=C[i][3].map((x,j)=>`<div class="lesson">${j+1}. ${x} <button class="btn alt" onclick="play(${i},${j})">▶</button></div>`).join('')}function text(x,j){return `欢迎来到《${x[2]}》第${j+1}节，${x[3][j]}。这一节我们不考试，只讲一个今天就能用的小方法。先想一想，最近有没有一个具体场景和这个主题有关。很多关系和生活习惯的改变，不是靠一次讲大道理，而是靠一个小动作反复练习。今天请先观察，不急着责怪自己或别人；把发生了什么、自己的感受、真正需要什么分开来看。然后只选一个最小行动去试。例如少说一句指责，多问一个问题；少刷十分钟手机，多做十分钟真正想完成的事；或者在健康上少一支烟、少一杯酒、多走十分钟。做不到满分也没关系，重点是比昨天多看见一点。今天试试看：把你最想改善的一件小事，用一句具体、温和、能做到的话说出来。` }function play(i,j){stop();cur={i,j};localStorage.guestResume=JSON.stringify(cur);let x=C[i];pt.textContent='🎧 '+x[2];ps.textContent=`第${j+1}/${x[3].length}节 · ${x[3][j]}`;player.classList.add('on');let u=new SpeechSynthesisUtterance(text(x,j));u.lang='zh-CN';u.rate=+rate.value;u.onend=()=>{if(cur&&cur.i===i&&cur.j===j&&j+1<x[3].length)play(i,j+1)};speechSynthesis.speak(u)}function stop(){speechSynthesis.cancel()}function next(){if(cur&&cur.j+1<C[cur.i][3].length)play(cur.i,cur.j+1)}function prev(){if(cur&&cur.j>0)play(cur.i,cur.j-1)}renderTabs();render();let r=localStorage.guestResume;if(r){try{let q=JSON.parse(r);let d=document.createElement('div');d.className='privacy';d.innerHTML=`🎧 上次听到：${C[q.i][2]} · 第${q.j+1}节　<button class="btn" onclick="play(${q.i},${q.j})">继续播放 ▶</button>`;document.querySelector('.hero').appendChild(d)}catch(e){}}</script></body></html>
