<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>访客听书馆 · V17</title><link rel='stylesheet' href='assets/css/app.css'></head><body><div class='app'><div class='hero'><span class='tag'>🌿 Guest · V17 公共馆</span><h1>访客听书馆</h1><p class='muted'>这里直接读取 Family Hub V17 的公共书库和同一套课程内容。访客不会加载家庭动态、照片、成员进度、看板或任何家庭私密数据。</p><button class='btn' onclick="location.href='v17.html'">← 返回家庭入口</button></div><div class='nav'><button onclick="setGuestCat('全部')">全部</button><span id='guestCats'></span></div><section class='section on'><div class='grid' id='guestBooks'></div></section></div><div class='player'><div class='pinner'><strong id='pt'>还没有播放</strong><div id='ps'>选择公开课程开始</div><div id='captionBox' class='captionBox'><span class='captionLabel'>正在播放字幕</span><span id='captionText'></span></div><button class='transcriptToggle' onclick='FamilyHubPlayer.toggleTranscript()'>📜 展开 / 收起全文字幕</button><div id='transcriptBox' class='transcriptBox'><div id='transcriptText'></div></div><input id='progress' class='bar' type='range' value='0'><div class='controls'><button id='playBtn' onclick='FamilyHubPlayer.toggle()'>▶</button><button onclick='FamilyHubPlayer.seek(-15)'>-15s</button><button onclick='FamilyHubPlayer.seek(15)'>+15s</button><select id='speed' onchange='FamilyHubPlayer.speed(this.value)'><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select><select onchange='FamilyHubPlayer.sleep(this.value)'><option value=''>睡眠</option><option value='15'>15分钟</option><option value='30'>30分钟</option><option value='60'>60分钟</option></select><span id='time'>--:--</span></div></div><audio id='audio'></audio></div><script src='assets/js/catalog.js'></script><script src='assets/js/player.js'></script><script src='assets/js/content-policy.js'></script><script src='assets/js/courses/parenting.js'></script><script src='assets/js/courses/relationships.js'></script><script src='assets/js/courses/teen.js'></script><script src='assets/js/courses/money.js'></script><script src='assets/js/courses/shared-rest.js'></script><script src='assets/js/courses/longform-family.js'></script><script src='assets/js/courses/longform-core-batch2.js'></script><script src='assets/js/courses/longform-core-batch3.js'></script><script src='assets/js/courses/longform-money-personal.js'></script><script src='assets/js/courses/shared-rest-longform.js'></script><script src='assets/js/courses/longform-completion-batch1.js'></script><script src='assets/js/courses/longform-completion-public6.js'></script><script src='assets/js/courses/longform-depth-batch1.js'></script><script src='assets/js/courses/longform-depth-public2-a.js'></script><script src='assets/js/courses/longform-depth-public2-b.js'></script><script src='assets/js/courses/longform-depth-public2-c.js'></script><script src='assets/js/course-runtime.js'></script><script>(function(){var cat='全部';function esc(s){return String(s).replaceAll("'","\\'")}window.setGuestCat=function(c){cat=c;render()};function render(){var data=FAMILY_HUB_CATALOG.shared,cats=Array.from(new Set(data.map(function(x){return x[0]})));guestCats.innerHTML=cats.map(function(c){return '<button class="'+(c===cat?'on':'')+'" onclick="setGuestCat(\''+c+'\')">'+c+'</button>'}).join('');guestBooks.innerHTML=data.filter(function(x){return cat==='全部'||x[0]===cat}).map(function(x){var has=FamilyHubCourses.has(x[1]),st=has?FamilyHubCourses.stats(x[1],'long'):null;return '<div class="card"><span class="tag">'+x[0]+'</span><h3>《'+x[1]+'》</h3><p class="muted">'+(has?'⚡ 快速精讲 · 🎧 有正文 '+st.completed+'/'+st.lessons+' · ✅ 真正≥12分钟 '+st.ready+'/'+st.lessons:'🛠️ 内容升级中')+'</p>'+(has?'<button class="btn" onclick="openGuestCourse(\''+esc(x[1])+'\',this,\'long\')">🎧 长篇伴读</button><button class="btn alt" onclick="openGuestCourse(\''+esc(x[1])+'\',this,\'quick\')">⚡ 快速精讲</button>':'')+'<div class="lessons"></div></div>'}).join('')}window.openGuestCourse=function(t,btn,mode){var box=btn.parentElement.querySelector('.lessons'),a=FamilyHubCourses.get(t,mode);box.style.display='block';box.innerHTML=a.map(function(x,i){var meta=x.complete?('约'+x.minutes+'分钟 · '+x.kind+(mode==='long'&&!x.depthReady?' · 目标12–20分钟':'')):'🛠️ 正在扩写';return '<div class="lesson"><b>第'+(i+1)+'节 · '+x.title+'</b><br><span class="muted">'+meta+'</span><br>'+(x.complete?'<button class="btn alt" onclick="playGuest(\''+esc(t)+'\','+i+',\''+mode+'\')">▶ 播放</button>':'')+'</div>'}).join('')};window.playGuest=function(t,i,mode){var all=FamilyHubCourses.get(t,mode),items=all.slice(i).filter(function(x){return x.complete}).map(function(x){return{title:'《'+t+'》 · '+x.title,subtitle:'约'+x.minutes+'分钟 · '+x.kind,text:x.text}});if(!items.length)return;FamilyHubPlayer.playQueue(items,0);localStorage.guestResume=JSON.stringify({course:t,index:i,mode:mode})};FamilyHubPlayer.bind();render()})();</script></body></html>
