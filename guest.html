<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>访客听书馆</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f1e8;color:#292522;font-family:"Microsoft YaHei",system-ui}.app{max-width:1180px;margin:auto;padding:18px 18px 130px}.hero,.card{background:#fffaf3;border:1px solid #e4d8c8;border-radius:22px;padding:20px}.hero{background:linear-gradient(145deg,#fffaf2,#e4efe4)}h1{font-size:38px}.cats{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.cats button,.btn{border:0;border-radius:999px;background:#fff;padding:11px 15px;cursor:pointer}.cats button.on,.btn{background:#31513d;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.muted{color:#756b62;line-height:1.7}.lessons{display:none;border-top:1px solid #eadfd2;margin-top:10px}.lesson{padding:10px 0;border-bottom:1px solid #eadfd2}.player{position:fixed;bottom:0;left:0;right:0;background:#21362a;color:#fff;padding:14px;text-align:center}.player button,.player select{padding:9px;border:0;border-radius:9px;margin:3px}.badge{display:inline-block;background:#e4eee3;border-radius:999px;padding:5px 9px;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:29px}}</style></head><body><main class="app"><div class="hero"><div>🌿 慢慢成长 · 访客听书馆</div><h1>欢迎来坐坐，挑一个想听的主题</h1><p class="muted">这里包含公开的沟通、亲子、家庭、青春期、心理、成长、理财与人生书单。访客看不到家庭动态、照片、留言、成员学习记录或后台数据。</p><button class="btn" onclick="location.href='index.html'">← 返回家庭入口</button></div><div class="cats" id="cats"></div><div class="grid" id="books"></div></main><div class="player"><b id="pt">选择一本书的章节开始</b><br><span id="ps">当前公开课程使用原创导读朗读；真实完整音频会在取得合法音源后接入。</span><br><button onclick="speechSynthesis.pause()">⏸</button><button onclick="speechSynthesis.resume()">▶</button><select id="speed"><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select><button onclick="speechSynthesis.cancel()">■</button></div><script>const data=[['亲子教育','正面管教'],['亲子教育','被忽视的孩子'],['亲子教育','园丁与木匠'],['亲子教育','父母的觉醒'],['亲子教育','如何说孩子才会听，怎么听孩子才肯说'],['亲子教育','孩子，把你的手给我'],['亲子教育','养育男孩'],['家庭关系','不完美的父母'],['家庭关系','热锅上的家庭'],['家庭关系','家庭的觉醒'],['家庭关系','中国式家庭'],['家庭关系','高能量家庭'],['婚姻沟通','幸福的婚姻'],['婚姻沟通','爱的五种语言'],['沟通关系','非暴力沟通'],['沟通关系','关键对话'],['沟通关系','情绪智力'],['青春成长','解码青春期'],['青春成长','青春期关键对话'],['心理情绪','被讨厌的勇气'],['心理情绪','蛤蟆先生去看心理医生'],['心理情绪','少有人走的路'],['心理情绪','人性的弱点'],['成长学习','刻意练习'],['成长学习','认知天性'],['成长学习','自驱型成长'],['成长学习','微习惯'],['成长学习','自控力'],['成长学习','思考，快与慢'],['成长学习','学会提问'],['成长学习','认知觉醒'],['成长学习','习惯的力量'],['成长学习','如何阅读一本书'],['理财人生','小狗钱钱'],['理财人生','金钱心理学'],['理财人生','穷查理宝典'],['理财人生','财务自由之路'],['人生阅读','生命之书'],['人生阅读','人类简史'],['人生阅读','中国通史'],['人生阅读','明朝那些事儿'],['人生阅读','50岁以后继续成长'],['健康生活','日常饮食与健康生活'],['健康生活','睡眠、运动与中年健康'],['健康生活','少一点烟酒，多一点健康']];const themes=['先认识这本书','它真正想解决的问题','看见旧模式','感受与需要','沟通与表达','一个马上能用的方法','冲突时怎么做','边界与尊重','家庭案例','从知道到做到','生活练习','今天的小行动','常见误区','复盘与成长'];let filter='全部';function render(){let cs=['全部',...new Set(data.map(x=>x[0]))];cats.innerHTML=cs.map(c=>`<button class="${c===filter?'on':''}" onclick="filter='${c}';render()">${c}</button>`).join('');books.innerHTML=data.filter(x=>filter==='全部'||x[0]===filter).map(x=>`<div class="card"><span class="badge">${x[0]}</span><h3>${x[1]}</h3><p class="muted">14节公开原创导读课程</p><button class="btn" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block'">查看章节</button><div class="lessons">${themes.map((t,i)=>`<div class="lesson">第${i+1}节 · ${t} <button onclick="play('${x[1].replace(/'/g,"\\'")}',${i})">▶</button></div>`).join('')}</div></div>`).join('')}function play(title,i){speechSynthesis.cancel();pt.textContent=title+' · 第'+(i+1)+'节';ps.textContent=themes[i]+'｜原创导读朗读';let u=new SpeechSynthesisUtterance(`${title}，第${i+1}节，${themes[i]}。这是公开原创导读，不是对原书全文的复制。今天先带走一个小行动：把你听到的内容，变成一句可以在生活里实践的话。`);u.lang='zh-CN';u.rate=+speed.value;speechSynthesis.speak(u);localStorage.guestResume=JSON.stringify({title,lesson:i})}render();</script></body></html>
